<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peptide — Mirai Labs 未来</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mirai: {50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d'}
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-white text-slate-900 antialiased">

  <div class="bg-slate-900 text-white text-xs sm:text-sm py-2.5 px-4 text-center tracking-wide">
    <span class="text-red-400 font-medium">FOR RESEARCH & EDUCATIONAL USE ONLY</span>
    <span class="mx-2 text-slate-500">•</span>
    Not for human or animal consumption • Not medical advice
  </div>

  <nav class="bg-white border-b border-slate-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center"><div class="w-3 h-3 rounded-full bg-white"></div></div>
          <div class="flex flex-col leading-none">
            <span class="font-semibold text-[15px] tracking-tight">MIRAI LABS</span>
            <span class="text-[10px] text-red-600 tracking-widest">未来</span>
          </div>
        </a>
        <div class="hidden md:flex items-center gap-7 text-sm font-medium">
          <a href="index.html" class="text-slate-600 hover:text-red-600 transition">Home</a>
          <a href="guide.html" class="text-slate-600 hover:text-red-600 transition">Peptide Guide</a>
          <a href="stack.html" class="text-slate-600 hover:text-red-600 transition">Stack Builder</a>
          <a href="about.html" class="text-slate-600 hover:text-red-600 transition">About</a>
          <a href="contact.html" class="text-slate-600 hover:text-red-600 transition">Contact</a>
        </div>
        <a href="stack.html" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-full text-sm font-medium transition">Build a Stack</a>
      </div>
    </div>
  </nav>

  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <a href="guide.html" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-red-600 mb-8 transition">
      ← Back to Guide
    </a>
    <div id="content"></div>
  </div>

  <footer class="bg-slate-900 text-slate-400 mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center text-xs">
      <p class="mb-1">Educational resource only. Not for human consumption. Not medical advice.</p>
      <p>© 2026 Mirai Labs 未来</p>
    </div>
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/vial-sizes.js"></script>
  <script>
    const id = new URLSearchParams(window.location.search).get('id');
    const p = peptides.find(x => x.id === id);

    if (!p) {
      document.getElementById('content').innerHTML = `
        <div class="text-center py-20">
          <h1 class="text-2xl font-bold mb-2">Compound not found</h1>
          <a href="guide.html" class="text-red-600 font-medium">Return to guide</a>
        </div>`;
    } else {
      document.title = `${p.name} — Mirai Labs 未来`;
      document.getElementById('content').innerHTML = `
        <div class="text-sm font-medium text-red-600 mb-2">${p.categoryLabel}</div>
        <h1 class="text-3xl font-bold tracking-tight mb-3">${p.name}</h1>
        <p class="text-slate-600 text-lg mb-8">${p.shortDesc}</p>

        <div class="bg-red-50 border border-red-100 rounded-2xl p-4 mb-6 text-sm text-red-900">
          <strong>Educational content only.</strong> This information is provided for research discussion purposes. It is not medical advice and does not recommend or encourage human use.
        </div>
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-10 text-sm text-amber-900">
          <strong>Stacking &amp; combinations:</strong> Any discussion of combining research compounds is for scientific education only. Always consult a qualified healthcare provider before considering any research compound or combination.
        </div>

        <section class="mb-10 bg-slate-50 border border-slate-200 rounded-2xl p-5">
          <h2 class="text-lg font-semibold mb-3">Vial size & quantity</h2>
          <p class="text-sm text-slate-600 mb-4">Amounts describe the total contents of one vial, not a dose or instructions for use. Availability is confirmed on inquiry.</p>
          ${vialSizes[p.id] ? `<label for="vial-size" class="block text-sm font-medium mb-2">Amount per vial</label><select id="vial-size" class="w-full max-w-full border border-slate-300 rounded-xl p-3 bg-white text-base">${sizeOptions(p.id)}</select>` : '<p class="text-sm text-slate-600">Vial specifications awaiting confirmation. You can still request research information.</p>'}
          <label for="vial-quantity" class="block text-sm font-medium mt-4 mb-2">Number of vials</label>
          <input id="vial-quantity" type="number" min="1" max="999" step="1" required inputmode="numeric" value="1" class="w-28 border border-slate-300 rounded-xl p-3 bg-white text-base">
        </section>

        <section class="mb-10">
          <h2 class="text-lg font-semibold mb-3">Mechanism of Interest</h2>
          <p class="text-slate-600 leading-relaxed">${p.mechanism}</p>
        </section>

        <section class="mb-10">
          <h2 class="text-lg font-semibold mb-3">Primary Research Focus Areas</h2>
          <ul class="space-y-2">
            ${p.researchFocus.map(f => `<li class="flex items-start gap-2 text-slate-600"><span class="text-red-500 mt-1">•</span>${f}</li>`).join('')}
          </ul>
        </section>

        <section class="mb-10">
          <h2 class="text-lg font-semibold mb-3">Key Findings from the Literature</h2>
          <p class="text-slate-600 leading-relaxed">${p.keyFindings}</p>
        </section>

        ${p.researchDoseNotes ? `
        <section class="mb-10">
          <h2 class="text-lg font-semibold mb-3">Research Dose Context</h2>
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5">
            <p class="text-slate-600 leading-relaxed text-sm mb-4">${p.researchDoseNotes}</p>
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 leading-relaxed">
              <strong>Not a dosage recommendation.</strong> The ranges above reflect what has appeared in research literature or study protocols. They are provided for educational discussion only. They are not instructions for use, not medical advice, and not a suggestion that any compound should be used in humans. Always consult a qualified healthcare provider regarding any research compound.
            </div>
          </div>
        </section>
        ` : ''}

        <div class="flex flex-wrap gap-2 mb-10">
          ${p.tags.map(t => `<span class="px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs">${t}</span>`).join('')}
        </div>

        <div class="flex flex-wrap gap-3">
          <a id="add-research-list" href="stack.html" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-full text-sm font-medium transition">
            Add to Stack Builder
          </a>
          <a href="guide.html" class="border border-slate-200 hover:border-slate-300 px-6 py-3 rounded-full text-sm font-medium transition">
            Back to Guide
          </a>
        </div>
      `;
      document.getElementById('add-research-list').addEventListener('click', (event) => {
        const quantityControl = document.getElementById('vial-quantity');
        if (!quantityControl.reportValidity()) { event.preventDefault(); return; }
        let list = readSaved('mirai_research_list', []);
        if (!Array.isArray(list)) list = [];
        if (!list.includes(p.id)) list.push(p.id);
        let saved = readSaved('mirai_vial_sizes', {});
        if (typeof saved !== 'object' || Array.isArray(saved)) saved = {};
        let quantities = readSaved('mirai_vial_quantities', {});
        if (typeof quantities !== 'object' || Array.isArray(quantities)) quantities = {};
        quantities[p.id] = Number(quantityControl.value);
        saved[p.id] = document.getElementById('vial-size')?.value || '';
        localStorage.setItem('mirai_research_list', JSON.stringify(list));
        localStorage.setItem('mirai_vial_sizes', JSON.stringify(saved));
        localStorage.setItem('mirai_vial_quantities', JSON.stringify(quantities));
      });
    }
  </script>
  <script src="assets/age-gate.js"></script>
</body>
</html>
